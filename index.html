<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Hello</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
    }
    input {
      font-size: 1.5rem;
      padding: 0.5rem 1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #6366f1;
    }
    #message {
      margin-top: 1.5rem;
      font-size: 2rem;
      font-weight: bold;
      color: #6366f1;
      min-height: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="text" id="input" placeholder="Type something..." autofocus>
    <div id="message"></div>
  </div>
  <script>
    const input = document.getElementById('input');
    const message = document.getElementById('message');
    input.addEventListener('input', () => {
      message.textContent = input.value.toLowerCase() === 'claude' ? 'Hello World' : '';
    });
  </script>
</body>
</html>
